"""
Represents a user account in the system.
"""
type User {
  id: ID!
  email: String!
  displayName: String!
  createdAt: String!
}

"""
Connection pagination for User lists.
"""
type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
}

type UserEdge {
  cursor: String!
  node: User!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  me: User
  users(first: Int = 20, after: String): UserConnection!
}\n